packages:
  - 'apps/*'
  - 'packages/*'
# Exemptions from pnpm 11's default minimumReleaseAge policy (1 day): the pinned toolchain below is wanted as fresh
# as the lockfile carries it
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.1'
  - '@turbo/darwin-arm64@2.11.1'
  - '@turbo/linux-64@2.11.1'
  - '@turbo/linux-arm64@2.11.1'
  - '@turbo/windows-64@2.11.1'
  - '@turbo/windows-arm64@2.11.1'
  - turbo@2.11.1
  - drizzle-orm@0.45.3
  - drizzle-kit@0.31.11
  - '@cloudflare/unenv-preset@2.16.2'
  - miniflare@5.20260921.0-alpha
  - wrangler@4.136.2
catalog:
  '@aws-sdk/client-s3': 3.1111.0
  '@aws-sdk/client-sesv2': 3.1129.0
