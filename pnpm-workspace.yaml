catalogs:
  # The Next.js apps type-check with a newer toolchain than the packages build with
  apps:
    '@types/node': 26.4.1
    typescript: 7.0.2
allowBuilds:
  '@firebase/util': false
  # Ships Node-API prebuilds for every platform; a build from source would only be slower
  better-sqlite3: false
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: false
  unrs-resolver: true
  # Picks the prebuilt binary out of the @cloudflare/workerd-* platform package; a build from source would be slower
  workerd: true
